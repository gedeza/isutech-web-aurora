# nginx site for the iSuTech website on Dube TradePort (isutech-svr-01).
# Install as /etc/nginx/sites-available/isutech-web, symlink into sites-enabled.
# This is HTTP-only on purpose: run `sudo certbot --nginx -d isutech.co.za -d www.isutech.co.za`
# and `sudo certbot --nginx -d api.isutech.co.za` afterwards and certbot adds the 443 blocks + redirects.
# Prerequisite: the DNS A records must already point at Dube, or certbot's HTTP challenge fails.

# --- Frontend (Vite SPA, static build) -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name isutech.co.za www.isutech.co.za;

    root /data/www/isutech-web/dist;
    index index.html;

    # Hashed build assets: cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (same behaviour as the old vercel.json rewrite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Applicant resumes are personal data: never served publicly (must precede /uploads/)
    location ^~ /uploads/resumes/ {
        deny all;
        return 404;
    }

    # Admin-uploaded images are written by the backend to backend/uploads
    location /uploads/ {
        alias /data/www/isutech-web/backend/uploads/;
        expires 7d;
    }

    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# --- API (Express, pm2, 127.0.0.1:4010) ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.isutech.co.za;

    client_max_body_size 10m;   # backend MAX_FILE_SIZE is 5 MB; resume/image uploads

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:4010;   # keep in sync with PORT in backend/.env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Applicant resumes are personal data: never served publicly (must precede /uploads/)
    location ^~ /uploads/resumes/ {
        deny all;
        return 404;
    }

    # Uploads are referenced as /uploads/<file> by the API responses
    location /uploads/ {
        alias /data/www/isutech-web/backend/uploads/;
        expires 7d;
    }
}
